<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Annonce Discord PRO</title>

<style>
body{
  background:#0f1117;
  font-family:Arial,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.container{
  background:#181b23;
  padding:20px;
  width:470px;
  border-radius:10px;
}
h2{text-align:center;margin-bottom:15px}
input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border-radius:6px;
  border:none;
  background:#0f1117;
  color:#fff;
}
textarea{height:110px;resize:none}
input[type="color"]{height:40px}
button{
  width:100%;
  padding:12px;
  background:#5865F2;
  border:none;
  color:#fff;
  font-size:16px;
  border-radius:6px;
  cursor:pointer;
}
button:hover{background:#4752c4}
.file-item{
  display:flex;
  justify-content:space-between;
  background:#0f1117;
  padding:6px 8px;
  border-radius:5px;
  margin-bottom:5px;
  font-size:13px;
}
.remove{color:#ff5c5c;cursor:pointer}
</style>
</head>

<body>
<div class="container">
<h2>📢 Annonce Discord</h2>

<input id="webhook" placeholder="Webhook Discord">
<input id="username" placeholder="Nom du webhook">
<textarea id="message" placeholder="Message de l'annonce"></textarea>

🎨 Couleur :
<input type="color" id="color" value="#9b59b6">

📎 Images / Vidéos / Fichiers :
<input type="file" id="files" multiple>

<div id="fileList"></div>

<button onclick="send()">🚀 Envoyer</button>
</div>

<script>
let files = [];
const fileInput = document.getElementById("files");
const fileList = document.getElementById("fileList");

fileInput.addEventListener("change",()=>{
  for(const f of fileInput.files) files.push(f);
  fileInput.value="";
  renderFiles();
});

function renderFiles(){
  fileList.innerHTML="";
  files.forEach((f,i)=>{
    const div=document.createElement("div");
    div.className="file-item";
    div.innerHTML=`
      <span>${f.name}</span>
      <span class="remove" onclick="removeFile(${i})">❌</span>
    `;
    fileList.appendChild(div);
  });
}

function removeFile(i){
  files.splice(i,1);
  renderFiles();
}

function send(){
  const webhook=document.getElementById("webhook").value;
  const username=document.getElementById("username").value || "Annonce";
  const message=document.getElementById("message").value;
  const color=parseInt(document.getElementById("color").value.replace("#",""),16);

  if(!webhook || !message){
    alert("Webhook et message obligatoires");
    return;
  }

  const form=new FormData();
  let embeds=[];
  let index=1;
  let firstDescriptionUsed=false;

  files.forEach(f=>{
    form.append("file"+index,f);

    // Images → embed
    if(f.type.startsWith("image")){
      embeds.push({
        description: !firstDescriptionUsed ? message : null,
        color: color,
        image:{url:"attachment://"+f.name}
      });
      firstDescriptionUsed=true;
    }

    index++;
  });

  // Si aucune image → embed texte seul
  if(embeds.length===0){
    embeds.push({description:message,color:color});
  }

  form.append("payload_json",JSON.stringify({
    username:username,
    embeds:embeds
  }));

  fetch(webhook,{method:"POST",body:form})
    .then(()=>alert("Annonce envoyée ✅"))
    .catch(()=>alert("Erreur ❌"));
}
</script>
</body>
</html>
